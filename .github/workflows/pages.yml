name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm install --global firebase-tools@15.20.0
      - run: firebase emulators:exec --only firestore --project demo-mylogue-approval "node --test tests/approval-rules.test.js tests/admin-access-rules.test.js tests/plan-rules.test.js tests/consent-rules.test.js tests/request-quota-rules.test.js tests/coach-rules.test.js tests/coach-room-rules.test.js tests/gym-request-rules.test.js tests/record-rewrite-rules.test.js tests/mate-rules.test.js tests/auth-rules.test.js tests/tag-rules.test.js tests/coach-role-rules.test.js"
      - run: npm run build
      - run: node verify-build.mjs
      # 4.27.0 재검사 N-10: 배포 전 연기 시험(헤드리스 크롬으로 탭·창을 열어 콘솔 오류 0)
      - run: npm run smoke
        env:
          CHROME: /usr/bin/google-chrome
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마이로그 오로라 배경</title><style>
@font-face{font-family:SUIT;src:url('../../app/fonts/SUIT-Regular.ttf')}@font-face{font-family:SUIT;src:url('../../app/fonts/SUIT-Bold.ttf');font-weight:700}
*{box-sizing:border-box}body{margin:0;background:#101625;color:#edf4f8;font:16px/1.5 SUIT,'Malgun Gothic',sans-serif;word-break:keep-all;overflow-wrap:break-word}main{max-width:1430px;margin:auto;padding:clamp(12px,3vw,36px)}header{margin:12px 0 28px}header b{color:#8ce4e0}h1{font-size:clamp(28px,4.8vw,48px);letter-spacing:-.05em;line-height:1.15;margin:6px 0}h2{font-size:22px;margin:0 0 7px}small,figcaption{font-size:13px;color:#b4c6da;font-weight:400}small{margin-left:7px}section{margin:0 0 25px}.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,328px);gap:15px;align-items:start}figure{min-width:0;margin:0}figcaption{margin:0 0 4px}.hero{width:100%;min-width:0;position:relative;display:grid;align-content:center;isolation:isolate;overflow:hidden;border-radius:22px;border:1px solid #5c7898;background:#101625;aspect-ratio:3/1;min-height:220px;padding:clamp(12px,3vw,34px)}.hero img{width:100%;height:100%;object-fit:cover;object-position:right center;position:absolute;inset:0;z-index:-1}.hero p{width:62%;margin:0;color:#edf4f8;font-size:47px;font-weight:700;line-height:1.15;letter-spacing:-.055em}.mobile .hero{min-height:230px;aspect-ratio:328/230;padding:16px}.mobile .hero p{font-size:30px;width:59%}@media(max-width:740px){.pair{grid-template-columns:minmax(0,1fr)}.mobile{width:min(100%,328px)}.wide .hero{min-height:0;padding:clamp(10px,2.7vw,20px)}.wide .hero p{width:60%;font-size:clamp(18px,5.6vw,38px)}} 
.overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:26px}.overview a{display:grid;gap:4px;color:#edf4f8;text-decoration:none;font-size:14px}.overview a:focus-visible{outline:2px solid #8ce4e0;outline-offset:3px}.overview img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border:1px solid #5c7898;border-radius:12px}@media(max-width:540px){.overview{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main><header><b>Mylogue</b><h1>시간대별 오로라 배경</h1></header><nav aria-label="시간대별 배경 한눈에 비교" class="overview">
<a href="#morning"><img src="hero-morning-mobile-v2.png" alt=""><span>아침</span></a>
<a href="#day"><img src="hero-day-mobile.png" alt=""><span>낮</span></a>
<a href="#evening"><img src="hero-evening-mobile.png" alt=""><span>저녁</span></a>
<a href="#night"><img src="hero-night-mobile-v2.png" alt=""><span>밤</span></a>
</nav><section id="morning"><h2>아침 <small>05:00–11:00</small></h2><div class="pair"><figure class="wide"><figcaption>와이드 · 2400×800</figcaption><div class="hero"><img src="hero-morning-wide-v2.png" alt=""><p>가장 쉬운 건강 관리의 시작, 기록.</p></div></figure><figure class="mobile"><figcaption>모바일 · 1200×800</figcaption><div class="hero"><img src="hero-morning-mobile-v2.png" alt=""><p>가장 쉬운 건강 관리의 시작, 기록.</p></div></figure></div></section>
<section id="day"><h2>낮 <small>11:00–17:00</small></h2><div class="pair"><figure class="wide"><figcaption>와이드 · 2400×800</figcaption><div class="hero"><img src="hero-day-wide.png" alt=""><p>가장 쉬운 건강 관리의 시작, 기록.</p></div></figure><figure class="mobile"><figcaption>모바일 · 1200×800</figcaption><div class="hero"><img src="hero-day-mobile.png" alt=""><p>가장 쉬운 건강 관리의 시작, 기록.</p></div></figure></div></section>
<section id="evening"><h2>저녁 <small>17:00–21:00</small></h2><div class="pair"><figure class="wide"><figcaption>와이드 · 2400×800</figcaption><div class="hero"><img src="hero-evening-wide.png" alt=""><p>가장 쉬운 건강 관리의 시작, 기록.</p></div></figure><figure class="mobile"><figcaption>모바일 · 1200×800</figcaption><div class="hero"><img src="hero-evening-mobile.png" alt=""><p>가장 쉬운 건강 관리의 시작, 기록.</p></div></figure></div></section>
<section id="night"><h2>밤 <small>21:00–05:00</small></h2><div class="pair"><figure class="wide"><figcaption>와이드 · 2400×800</figcaption><div class="hero"><img src="hero-night-wide-v2.png" alt=""><p>가장 쉬운 건강 관리의 시작, 기록.</p></div></figure><figure class="mobile"><figcaption>모바일 · 1200×800</figcaption><div class="hero"><img src="hero-night-mobile-v2.png" alt=""><p>가장 쉬운 건강 관리의 시작, 기록.</p></div></figure></div></section></main></body></html>

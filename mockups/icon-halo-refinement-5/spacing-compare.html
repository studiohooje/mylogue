<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마웨로그 5번 여백 조정</title><style>@font-face{font-family:SUIT;src:url('../../app/fonts/SUIT-Regular.ttf')}@font-face{font-family:SUIT;src:url('../../app/fonts/SUIT-Bold.ttf');font-weight:700}*{box-sizing:border-box}body{background:#101625;color:#edf4f8;font-family:SUIT,'Malgun Gothic',sans-serif;margin:0}main{max-width:950px;margin:auto;padding:38px 28px}small{color:#8ce4e0;letter-spacing:.13em;font-weight:700}h1{font-size:30px;letter-spacing:-.04em;margin:10px 0}p{color:#b4c6d8;line-height:1.6}.row{display:grid;grid-template-columns:1fr 1fr;gap:23px;margin-top:28px}.card{background:#1c2842;border:1px solid #465776;border-radius:20px;padding:25px;text-align:center}.card img.big{width:225px;max-width:100%;display:block;margin:0 auto 12px}.card strong{display:block;font-size:19px}.sizes{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:16px}.sizes img{width:48px}.sizes img.tiny{width:24px}.sizes span{font-size:11px;color:#9bb0c3}@media(max-width:600px){.row{gap:10px}.card{padding:12px}.card strong{font-size:15px}}</style></head><body><main><small>MYWEIGHTLOG · SPACING REFINEMENT</small><h1>5번의 원 안쪽 여백 조정</h1><p>색과 세 줄기·상단 호는 유지했습니다. 오른쪽은 원을 5% 키우고 안쪽 도형을 14% 줄여 가운데에 맞췄습니다.</p><div class="row"><div class="card"><img class="big" src="05-deep-frame.svg" alt="기존 5번"><strong>기존 5번</strong><div class="sizes"><img src="05-deep-frame.svg" alt=""><img class="tiny" src="05-deep-frame.svg" alt=""><span>48 / 24px</span></div></div><div class="card"><img class="big" src="05-roomy.svg" alt="여백을 넓힌 5번"><strong>여백을 넓힌 5번</strong><div class="sizes"><img src="05-roomy.svg" alt=""><img class="tiny" src="05-roomy.svg" alt=""><span>48 / 24px</span></div></div></div></main></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마웨로그 4번 디테일 시안</title><style>@font-face{font-family:SUIT;src:url('../../app/fonts/SUIT-Regular.ttf')}@font-face{font-family:SUIT;src:url('../../app/fonts/SUIT-Bold.ttf');font-weight:700}*{box-sizing:border-box}body{margin:0;background:#101625;color:#edf4f8;font-family:SUIT,'Malgun Gothic',sans-serif}main{max-width:1190px;margin:auto;padding:45px 28px 65px}small{font-size:12px;color:#8ce4e0;letter-spacing:.14em;font-weight:700}h1{font-size:31px;letter-spacing:-.04em;margin:9px 0}header p{color:#b4c6d8;margin:0;font-size:14px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin-top:30px}.card{background:#1c2842;border:1px solid #465776;border-radius:20px;padding:16px}.card img.big{display:block;width:100%;max-width:166px;margin:0 auto 18px}.tag{color:#8ce4e0;font-size:12px;font-weight:700}h2{font-size:17px;margin:7px 0;line-height:1.25}.sizes{display:flex;align-items:center;gap:10px;border-top:1px solid #465776;margin-top:19px;padding-top:13px}.sizes img{width:48px}.sizes img.tiny{width:24px}.sizes span{color:#94a9bd;font-size:10px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){main{padding:24px 15px}.card{padding:10px}.card img.big{max-width:120px}.card h2{font-size:15px}}</style></head><body><main><header><small>MYWEIGHTLOG · HALO REFINEMENT</small><h1>선택한 4번에서 디테일만 5가지</h1><p>1안은 선택하신 4번 그대로입니다. 원형 프레임과 세 줄기는 고정하고 호·색상만 가볍게 조정했습니다.</p></header><div class="grid"><article class="card"><img class="big" src="01-original.svg" alt="선택한 4번 그대로"><div class="tag">01</div><h2>선택한 4번 그대로</h2><div class="sizes"><img src="01-original.svg" alt=""><img class="tiny" src="01-original.svg" alt=""><span>48px / 24px</span></div></article><article class="card"><img class="big" src="02-cyan-arc.svg" alt="호만 청록으로"><div class="tag">02</div><h2>호만 청록으로</h2><div class="sizes"><img src="02-cyan-arc.svg" alt=""><img class="tiny" src="02-cyan-arc.svg" alt=""><span>48px / 24px</span></div></article><article class="card"><img class="big" src="03-short-arc.svg" alt="호를 짧고 가볍게"><div class="tag">03</div><h2>호를 짧고 가볍게</h2><div class="sizes"><img src="03-short-arc.svg" alt=""><img class="tiny" src="03-short-arc.svg" alt=""><span>48px / 24px</span></div></article><article class="card"><img class="big" src="04-blue-body.svg" alt="줄기를 맑은 파랑으로"><div class="tag">04</div><h2>줄기를 맑은 파랑으로</h2><div class="sizes"><img src="04-blue-body.svg" alt=""><img class="tiny" src="04-blue-body.svg" alt=""><span>48px / 24px</span></div></article><article class="card"><img class="big" src="05-deep-frame.svg" alt="프레임을 더 깊게"><div class="tag">05</div><h2>프레임을 더 깊게</h2><div class="sizes"><img src="05-deep-frame.svg" alt=""><img class="tiny" src="05-deep-frame.svg" alt=""><span>48px / 24px</span></div></article></div></main></body></html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111e">
  <title>마웨로그 · 입력창 5안</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="site-head">
      <div class="brand"><span class="mark">↗</span><div><strong>마웨로그</strong><small>ENTRY SURFACE LAB</small></div></div>
      <span class="demo-badge">클릭형 목업 · 실제 기록 저장 없음</span>
    </header>
    <main>
      <div class="intro"><div><p class="eyebrow">식단 5안 + 운동 5안</p><h1>기록창을 여는 방법,<br>직접 비교해 보세요.</h1><p>동일한 기록을 다섯 가지 화면 구조로 입력합니다. 음식별 중량과 운동별 세트는 직접 바꿔볼 수 있습니다.</p></div><div class="view-switch" role="group" aria-label="미리보기 너비"><button data-view="phone" class="selected">휴대전화</button><button data-view="wide">넓은 화면</button></div></div>
      <nav class="patterns" id="patterns" aria-label="입력창 방식"></nav>
      <div class="stage-head"><div><p id="pattern-tag" class="eyebrow"></p><h2 id="pattern-title"></h2><p id="pattern-desc"></p></div><div class="domain-switch" role="group" aria-label="입력 종류"><button data-domain="meal" class="selected">식단 입력</button><button data-domain="workout">운동 입력</button></div></div>
      <div class="stage-grid"><section class="preview phone" id="preview" aria-label="조작 가능한 목업"><div class="status"><span>9:41</span><span>●●● ▰</span></div><div class="preview-body" id="screen"></div><div class="home-indicator"></div></section><aside class="guide"><span class="guide-label">이 방식의 조작 순서</span><ol id="steps"></ol><div class="guide-note" id="note"></div><div class="guide-foot">예시 음식·운동과 수치는 화면 조작 확인용입니다. 이 목업은 계정이나 Firebase에 쓰지 않습니다.</div></aside></div>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>

<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b28"><title>마웨로그 · 홈 디자인 10종</title><link rel="stylesheet" href="style.css"></head>
<body><div class="lab">
  <aside class="selector" aria-label="디자인 선택"><div class="selector-head"><span class="mini-logo">M<span>W</span>L</span><p>MYWEIGHTLOG<br><strong>홈 디자인 랩</strong></p></div><p class="selector-intro">같은 홈 구조를 10개의 표현 방식으로 비교합니다. 화면 안의 버튼과 메뉴도 눌러보세요.</p><div id="choices" class="choices"></div><div class="selector-foot"><span id="counter">01 / 10</span><span>DESIGN STUDY · 2026</span></div></aside>
  <main class="stage"><div class="stage-top"><div><span class="stage-kicker">HOME CONCEPT</span><h1 id="concept-name">01. Midnight Performance</h1><p id="concept-desc"></p></div><div class="stage-actions"><div class="device-switch" role="group" aria-label="미리보기 화면"><button id="view-web" class="selected" aria-pressed="true">웹 화면</button><button id="view-phone" aria-pressed="false">📱 앱 화면</button></div><button id="prev" aria-label="이전 디자인">←</button><button id="next" aria-label="다음 디자인">→</button></div></div><div class="viewport"><div id="app" class="app theme-1"></div><div class="phone-shell" id="phone-shell" hidden><div class="phone-bezel"><div class="phone-island"></div><iframe id="phone-frame" title="휴대폰 앱 디자인 미리보기"></iframe><div class="phone-home-indicator"></div></div></div></div><p class="prototype-note">디자인 비교용 예시 데이터입니다. 앱 화면은 390px 휴대폰 시뮬레이션이며 실제 APK는 아닙니다.</p></main>
</div><dialog id="action-dialog" class="action-dialog"><form method="dialog"><div class="dialog-top"><span id="dialog-icon">✦</span><button class="icon-btn" value="cancel" aria-label="닫기">×</button></div><h2 id="dialog-title">빠른 기록</h2><p id="dialog-copy">오늘의 기록을 선택하세요.</p><div id="dialog-options" class="dialog-options"></div><button class="dialog-close" value="cancel">닫기</button></form></dialog><script src="app.js"></script></body></html>

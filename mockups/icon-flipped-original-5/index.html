<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마웨로그 2번 반전 아이콘</title><style>@font-face{font-family:SUIT;src:url('../../app/fonts/SUIT-Regular.ttf')}@font-face{font-family:SUIT;src:url('../../app/fonts/SUIT-Bold.ttf');font-weight:700}*{box-sizing:border-box}body{margin:0;background:#101625;color:#edf4f8;font-family:SUIT,'Malgun Gothic',sans-serif}main{max-width:1200px;margin:auto;padding:45px 28px}small{color:#8ce4e0;letter-spacing:.14em;font-size:12px;font-weight:700}h1{font-size:31px;letter-spacing:-.04em;margin:10px 0}p{color:#b4c6d8;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px;margin-top:30px}.card{background:#1c2842;border:1px solid #465776;border-radius:20px;padding:16px}.card img.hero{display:block;width:100%;max-width:165px;margin:0 auto 19px}.card h2{font-size:17px;margin:8px 0}.tag{font-size:12px;color:#8ce4e0;font-weight:700}.sizes{display:flex;align-items:center;gap:10px;border-top:1px solid #465776;padding-top:15px;margin-top:18px}.sizes img{width:48px}.sizes img.tiny{width:24px}.sizes span{font-size:10px;color:#94a9bd}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){main{padding:25px 15px}.card{padding:10px}.card img.hero{max-width:120px}.card h2{font-size:15px}}</style></head><body><main><small>MYWEIGHTLOG · ORIGINAL 02 / FLIPPED</small><h1>2번을 뒤집은 형태, 작은 차이만 5가지</h1><p>1안은 처음 보여드린 2번의 도형을 그대로 상하 반전했습니다. 나머지는 같은 구조에서 작은 디테일만 조정했습니다.</p><div class="grid"><article class="card"><img class="hero" src="01-exact-flip.svg" alt="원안 그대로 반전"><div class="tag">01</div><h2>원안 그대로 반전</h2><div class="sizes"><img src="01-exact-flip.svg" alt=""><img class="tiny" src="01-exact-flip.svg" alt=""><span>48px / 24px</span></div></article><article class="card"><img class="hero" src="02-balanced-dots.svg" alt="양쪽 점만 같은 색"><div class="tag">02</div><h2>양쪽 점만 같은 색</h2><div class="sizes"><img src="02-balanced-dots.svg" alt=""><img class="tiny" src="02-balanced-dots.svg" alt=""><span>48px / 24px</span></div></article><article class="card"><img class="hero" src="03-slim-line.svg" alt="선만 조금 얇게"><div class="tag">03</div><h2>선만 조금 얇게</h2><div class="sizes"><img src="03-slim-line.svg" alt=""><img class="tiny" src="03-slim-line.svg" alt=""><span>48px / 24px</span></div></article><article class="card"><img class="hero" src="04-soft-weight.svg" alt="선·점에 무게감"><div class="tag">04</div><h2>선·점에 무게감</h2><div class="sizes"><img src="04-soft-weight.svg" alt=""><img class="tiny" src="04-soft-weight.svg" alt=""><span>48px / 24px</span></div></article><article class="card"><img class="hero" src="05-quiet-frame.svg" alt="테두리만 차분하게"><div class="tag">05</div><h2>테두리만 차분하게</h2><div class="sizes"><img src="05-quiet-frame.svg" alt=""><img class="tiny" src="05-quiet-frame.svg" alt=""><span>48px / 24px</span></div></article></div></main></body></html>

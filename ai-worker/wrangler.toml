# 마이로그 AI 서버 설정. 계정·비밀값은 여기 넣지 않는다(README의 배포 절차 참고).
name = "mylogue-ai"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[vars]
FIREBASE_PROJECT_ID = "mylogue-1eedb"
ALLOWED_ORIGINS = "https://mylogue.fit,https://www.mylogue.fit,https://studiohooje.github.io,https://localhost,http://localhost:4173"
DAILY_LIMIT = "30"
# 4.17.0 기본 모델은 저렴한 Haiku 5.5, 주간 리뷰는 Sonnet 5.5(원가 계산 기준과 같게)
MODEL = "claude-haiku-5-5"
REVIEW_MODEL = "claude-sonnet-5-5"
# 베타 동안 승인된 모든 계정을 플러스로(결제가 붙으면 "0"으로 바꾸고 계정별 plan을 쓴다)
PLUS_ALL = "0"
# 기능별 하루 한도: 무료/플러스
LIMIT_PHOTO = "3/20" # 2026-11-26 대표님: 무료 AI 사진 하루 3번(플러스 20번)
# 4.27.0 재검사 N-7: 월 원가 상한(700원) 안에서 매일 써도 월말까지 가도록 리뷰 하루 1번, 묻기 하루 10개
LIMIT_REVIEW = "0/1"
LIMIT_CHAT = "0/10"
LIMIT_RECIPE = "0/10"
# 5.0.4 AI 인사이트(분석 맨 위): 플러스 하루 3번, 버튼을 눌렀을 때만
LIMIT_INSIGHT = "0/3"
# 4.27.0 AI 원가 상한(1인 월, 원). 0이면 상한 없음. 기능별 1회 추정 원가(원)는 실제 청구와 비교해 고친다(확인 필요).
MONTHLY_COST_WON = "700"
COST_WON = "parse:2,photo:2.5,chat:2,recipe:2,review:40,insight:4"
# "1"이면 Claude 대신 정해진 답(시험·개발용). 실제 배포에서는 꼭 "0"
FAKE_AI = "0"
# 4.29.x 어느 회사 AI를 쓸지: "anthropic"(기본) | "openai-compatible"(OpenAI·Gemini·DeepSeek 등 OpenAI 형식)
# openai-compatible이면 AI_BASE_URL과 MODEL·REVIEW_MODEL을 그 회사 모델 이름으로, 키는 `wrangler secret put AI_API_KEY`
AI_PROVIDER = "anthropic"
AI_BASE_URL = ""
# 4.29.x 불필요한 호출 막기(src/guards.js). "0"이면 그 장치를 끈다(끄기 스위치 AI_ENABLED만 반대: "0"이면 AI 전체 멈춤)
AI_ENABLED = "1"
MAX_BODY_BYTES = "4500000"
RATE_PER_MIN = "6"
RATE_PER_HOUR = "60"
ADMIN_RATE_PER_MIN = "15"
ADMIN_RATE_PER_HOUR = "200"
DUP_WINDOW_SEC = "20"
# 서비스 전체 예산(원). 대표님 2026-11-25: 지금은 한 달 10,000원. 넘으면 운영자 포함 그날·그달 AI 멈춤. 0이나 글자는 무시되고 기본값(하루 3,000·한 달 30,000)으로.
# Fable 권고: 첫 주는 하루 1,000원으로 낮게 시작하고 콘솔 실제 청구액과 매일 비교한 뒤 올린다.
GLOBAL_DAILY_COST_WON = "1000"
GLOBAL_MONTHLY_COST_WON = "10000"
# 슈퍼관리자 비용 알림 기준(원, 한 달). 70%·90%·100%에서 앱 종 알림. 비우면 전체 월 상한을 기준으로.
ALERT_MONTHLY_WON = "10000"
# 숫자 칸에는 숫자만(쉼표·'원' 금지 — 섞이면 기본값으로 바뀜)
# 실제 사용량으로 장부 맞추기: 모델 가격(달러/100만 토큰 입력/출력, 기본 Haiku 5.5·Sonnet 5.5만 앎, 모르는 모델은 2/10으로 비싸게 침)
MODEL_PRICES = ""
USD_KRW = "1450"
# OpenAI 형식 회사 전용: 추론형 모델이면 "max_completion_tokens"·생각 노력 "minimal" 등, 시간 제한(밀리초)
AI_TOKEN_FIELD = ""
AI_REASONING_EFFORT = ""
AI_TIMEOUT_MS = "45000"

# 사용자별 하루 사용 횟수. `wrangler d1 create mylogue-ai`로 만든 뒤 나온 database_id를 아래에 넣는다.
[[d1_databases]]
binding = "DB"
database_name = "mylogue-ai"
database_id = "a6e0775c-3127-458f-8588-9be59fafedaf"

# 5.0.0 로그메이트 사진 저장소(R2, 비공개 버킷). 사진은 이 서버를 거쳐 방 멤버 확인 후에만 올리고 본다.
[[r2_buckets]]
binding = "MATE"
bucket_name = "mylogue-mate"
